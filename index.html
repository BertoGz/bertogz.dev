<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Berto Gonzalez</title>
  <meta name="description" content="Berto Gonzalez's portfolio.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2b1c12">
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="stylesheet" href="world.css">
</head>
<body>
  <script>window.__PORTFOLIO_ROOT = "";</script>
  <div class="world" id="world">
    <section class="stage" aria-label="Island view">
      <canvas id="view" role="img" aria-label="A 3D island of landmarks. Every landmark is also listed in the Projects panel."></canvas>
      <p class="action" id="action"></p>
      <canvas id="mini" aria-hidden="true"></canvas>
      <div class="tag" id="tag" aria-hidden="true">Berto</div>
      <button type="button" class="bgm-mute" id="bgm-mute" aria-pressed="true" aria-label="Unmute music"></button>
    </section>

    <section class="log" id="log" role="log" aria-label="Messages"></section>

    <aside class="side" id="side" aria-label="Portfolio">
      <button type="button" class="sheet-handle" id="sheet-handle" data-expand aria-label="Expand panel" hidden></button>
      <div class="tabs">
        <button type="button" data-tab="bio">Bio</button>
        <button type="button" data-tab="projects">Projects</button>
      </div>
      <button type="button" class="close-sheet" data-close aria-label="Close panel">×</button>
      <div class="panel" id="panel"></div>
    </aside>

    <nav class="dock" aria-label="Panels">
      <button type="button" data-tab="bio">Bio</button>
      <button type="button" data-tab="projects">Projects</button>
    </nav>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>

  <noscript><p>This page needs JavaScript. See the <a href="https://bertogz.github.io/">classic portfolio</a>.</p></noscript>

  <script src="projects.js"></script>
  <script src="repo-media.js"></script>
  <script src="map.js"></script>
  <script src="models.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
